name: release

# Pushing a tag `vX.Y.Z` stages the package on npm (trusted publishing, no
# stored token, public once a maintainer approves it with 2FA) unless that
# version is already there, then publishes a GitHub release whose notes are the
# `## X.Y.Z` section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          }

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          grep -q . notes.md || {
            echo "CHANGELOG.md has no section ## ${GITHUB_REF_NAME#v}" >&2
            exit 1
          }

      - run: pnpm install --frozen-lockfile
      # npm drops a `bin` whose file is missing when it reads package.json, before prepack has built it
      - run: pnpm build

      - name: npm
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@${GITHUB_REF_NAME#v}" version 2>/dev/null | grep -q .; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm, skipping"
          else
            if npm publish --dry-run 2>&1 | grep "auto-corrected"; then
              echo "npm would rewrite package.json on publish, run npm pkg fix" >&2
              exit 1
            fi
            npm stage publish
          fi

      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
