name: release

# Pushing a tag `vX.Y.Z` publishes the package on npm (trusted publishing, no
# stored token) unless that version is already there, then publishes a GitHub
# release whose notes are the `## X.Y.Z` section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          }

      - name: notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          grep -q . notes.md || {
            echo "CHANGELOG.md has no section ## ${GITHUB_REF_NAME#v}" >&2
            exit 1
          }

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: npm
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@${GITHUB_REF_NAME#v}" version 2>/dev/null | grep -q .; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm, skipping"
          else
            npm publish
          fi

      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
